<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100e"><title>مدار — حالت آفلاین</title><style>@font-face{font-family:V;src:url('/fonts/Vazirmatn-UI-Regular.woff2')}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07100e;color:#eaf7f2;font-family:V,Tahoma,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#0c1b17;border:1px solid #23483c;border-radius:22px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.logo{width:90px;height:90px;margin:auto;border-radius:22px}.eyebrow{color:#72efc6;font-size:11px;letter-spacing:1px;margin-top:18px}h1{font-size:25px;margin:8px 0}p{font-size:12px;line-height:2;color:#87a69b}.status{border:1px solid #334f2e;background:#181c12;color:#c7c391;border-radius:10px;padding:10px;font-size:10px;margin:18px 0}.actions{display:flex;gap:8px;justify-content:center}button,a{border-radius:10px;padding:10px 15px;font:inherit;font-size:11px;cursor:pointer;text-decoration:none}.retry{border:0;background:#72efc6;color:#062019}.home{border:1px solid #315a4d;background:#10241e;color:#b9d0c8}</style></head><body><main class="card"><img class="logo" src="/icons/icon-192.png" alt="مدار"><div class="eyebrow">OFFLINE MODE</div><h1>اتصال به سرور برقرار نیست</h1><p>بخش‌های آموزشی Cache‌شده همچنان از صفحه اصلی قابل استفاده‌اند. برای داده‌های تازه پرتاب‌ها، NASA/ESA و خلاصه‌ساز باید دوباره به اینترنت متصل شوید.</p><div class="status">آخرین بانک‌های معتبر در حالت آفلاین داخل برنامه نگه‌داری می‌شوند.</div><div class="actions"><button class="retry" onclick="location.reload()">تلاش دوباره</button><a class="home" href="/#dashboard">صفحه اصلی</a></div></main></body></html>
